name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check scripts
        run: |
          node --check scripts/importContentArchive.mjs
          node --check scripts/validateContentArchive.mjs
          node --check scripts/archiveCoverageReport.mjs
          node --check scripts/generateStaticArchive.mjs
          node --check public/service-worker.js

      - name: Report archive coverage
        run: npm run report:archive

      - name: Run tests
        run: npm test
